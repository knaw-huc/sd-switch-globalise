version: '2'

services:
  gl-switch:
    image: ghcr.io/knaw-huc/sd-switch-globalise:v1.0.0-RC1
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gl-switch.loadbalancer.server.port=8080"
      - "traefik.http.routers.gl-switch.entrypoints=http"
      - "traefik.http.routers.gl-switch.rule=Host(`resolve.sd.di.huc.knaw.nl`)"
    environment:
      - AWS_BUCKETNAME=$AWS_BUCKETNAME
      - AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
      - AWS_S3_ENDPOINT_URL=$AWS_S3_ENDPOINT_URL
    networks:
      - traefik-public
networks:
  traefik-public:
    external:
      name: traefik-public
